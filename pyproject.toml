[project]
name = "karaganda-air-quality"
version = "1.0.0"
description = "Meteorologically driven machine-learning prediction of PM2.5 in Karaganda, Kazakhstan"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "catboost>=1.2",
    "matplotlib>=3.9",
    "statsmodels>=0.14",
    "python-docx>=1.1",
    "python-pptx>=1.0",
]

[tool.uv]
package = false
